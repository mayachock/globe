<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conservation sites</title>

<!-- Стили и сам ArcGIS SDK (адблок может их блокировать) -->
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css">
<script src="https://js.arcgis.com/4.31/"></script>

<style>
/* Размеры: --s сторона фото, --pw расстояние от центра фото до края плашки, --r скругление */
:root { --s:128px; --pw:360px; --r:51px; }
html, body, #viewDiv { margin:0; height:100%; width:100%; background:#0b1f2e; }

/* Контейнер плашки при наведении: плавно проявляется, мышь не перехватывает */
#tip { position:fixed; pointer-events:none; z-index:99; display:flex; align-items:center;
       transform:translate(calc(var(--s) / -2), -50%);
       opacity:0; visibility:hidden;
       transition:opacity .2s ease, visibility 0s linear .2s; }
#tip.show { opacity:1; visibility:visible; transition:opacity .2s ease, visibility 0s; }
#tip.left { flex-direction:row-reverse; transform:translate(calc(-100% + var(--s) / 2), -50%); }

/* Фото внутри плашки */
#tip img { width:var(--s); height:var(--s); display:block; position:relative; z-index:2;
           border-radius:var(--r); box-shadow:0 2px 10px rgba(0,0,0,.3); }

/* Текст плашки: страна (мелко) и название (до 3 строк) */
#tip .country { font:700 12px/1.2 "Segoe UI", Arial, sans-serif; letter-spacing:.08em; text-transform:uppercase; color:#6b7a85; }
#tip .txt { font:600 17px/1.25 "Segoe UI", Arial, sans-serif; margin-top:4px; color:#111;
            display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }

/* Белая плашка: выезжает из-под фото */
#tip .plaque { box-sizing:border-box; position:relative; z-index:1;
               width:var(--pw); height:var(--s);
               margin-left:calc(var(--s) / -2);
               padding:0 22px 0 calc(var(--s) / 2 + 18px);
               display:flex; flex-direction:column; justify-content:center;
               background:#fff; border-radius:var(--r);
               box-shadow:0 4px 16px rgba(0,0,0,.3); }
#tip.left .plaque { margin-left:0; margin-right:calc(var(--s) / -2);
                    padding:0 calc(var(--s) / 2 + 18px) 0 22px; }
</style>
</head>
<body>

<!-- Сюда рисуется глобус -->
<div id="viewDiv"></div>

<!-- Плашка при наведении: фото + страна + название -->
<div id="tip"><img alt=""><div class="plaque"><div class="country"></div><div class="txt"></div></div></div>

<script>
/* ===== НАСТРОЙКИ ===== */
const SIZE = 128;      // сторона фото, px
const PLAQUE_W = 360;  // расстояние от центра фото до дальнего края плашки, px
const BORDER = 4;      // толщина белой рамки у фото, px
const RADIUS = 0.4;    // скругление фото (доля от стороны)

/* Подпись под фото (две буквы без фона) */
const LABEL_SIZE = 14;     // размер букв, px
const LABEL_WEIGHT = 500;  // толщина: 400 тонко, 500 средне, 700 жирно
const GAP = 4;             // зазор между фото и подписью, px
const SIDE = 10;           // боковой запас картинки маркера, px
const VPAD = 28;           // запас сверху и снизу картинки маркера, px

/* Границы зума: высота камеры над землёй, метры */
const MAX_Z = 6500000; // самое далёкое положение
const MIN_Z = 2200000; // самое близкое (меньше число = ближе)

/* ===== ДАННЫЕ О МЕСТАХ =====
   name — полное название (в плашке), label — подпись под фото,
   dx — сдвиг по экрану в px (разводит Нидерланды и UK),
   img — файл фото рядом с index.html, url — страница проекта */
const PLACES = [
  { name: "REEDS4ALL in Rhine-IJssel Delta (Netherlands)", label: "NL", lon: 5.92,  lat: 52.56, dx:  45, img: "NL.png", url: "https://example.com/story" },
  { name: "Peat extraction site in Sonkajärvi (Finland)",  label: "FI", lon: 27.52, lat: 63.67, dx:   0, img: "FI.png", url: "https://example.com/story" },
  { name: "Kuwasy pilot site in Biebrza (Poland)",         label: "PL", lon: 22.73, lat: 53.46, dx:   0, img: "PL.png", url: "https://example.com/story" },
  { name: "Great Fen (United Kingdom)",                    label: "UK", lon: -0.23, lat: 52.43, dx: -45, img: "UK.png", url: "https://example.com/story" }
];

/* Передаём размеры из JS в CSS */
document.documentElement.style.setProperty("--s", SIZE + "px");
document.documentElement.style.setProperty("--pw", PLAQUE_W + "px");

/* Контур скруглённого квадрата на canvas */
function roundRectPath(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

/* Делает из файла две картинки:
   photo — скруглённое фото с белой рамкой (для плашки при наведении);
   marker — то же фото с подписью под ним (для глобуса) */
function makeSquare(src, label) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => {
      /* 1. Фото: белая рамка, скруглённые углы, обрезка по центру до квадрата */
      const px = SIZE * 2, b = BORDER * 2;
      const c = document.createElement("canvas");
      c.width = c.height = px;
      const g = c.getContext("2d");
      roundRectPath(g, 0, 0, px, px, px * RADIUS);
      g.fillStyle = "#fff"; g.fill();
      g.save();
      roundRectPath(g, b, b, px - 2 * b, px - 2 * b, (px - 2 * b) * RADIUS);
      g.clip();
      const m = Math.min(im.width, im.height);
      g.drawImage(im, (im.width - m) / 2, (im.height - m) / 2, m, m, b, b, px - 2 * b, px - 2 * b);
      g.restore();
      const photo = c.toDataURL("image/png");

      /* 2. Маркер: запас сверху и снизу одинаковый, чтобы центр фото был центром маркера */
      const W = (SIZE + 2 * SIDE) * 2, H = (SIZE + 2 * VPAD) * 2;
      const mk = document.createElement("canvas");
      mk.width = W; mk.height = H;
      const k = mk.getContext("2d");
      k.drawImage(c, SIDE * 2, VPAD * 2, px, px);

      /* 3. Подпись без фона: светлые буквы с тонкой тёмной обводкой,
            выровнены по правому краю фото */
      k.font = LABEL_WEIGHT + " " + (LABEL_SIZE * 2) + 'px "Segoe UI", Arial, sans-serif';
      if ("letterSpacing" in k) k.letterSpacing = "2px";
      k.textAlign = "right";
      k.textBaseline = "middle";
      k.lineJoin = "round";
      const tx = (SIDE + SIZE) * 2 - 6;                          // правый край фото
      const ty = (VPAD + SIZE + GAP) * 2 + LABEL_SIZE;            // середина строки под фото
      k.strokeStyle = "rgba(11, 31, 46, 0.75)"; k.lineWidth = 6;
      k.strokeText(label, tx, ty);
      k.fillStyle = "#fff";
      k.fillText(label, tx, ty);

      resolve({ photo: photo, marker: mk.toDataURL("image/png") });
    };
    im.onerror = () => reject(new Error("Не найден файл " + src));
    im.src = src;
  });
}

/* ===== ГЛОБУС ===== */
require(["esri/Map", "esri/views/SceneView", "esri/Graphic", "esri/layers/GraphicsLayer"],
function (Map, SceneView, Graphic, GraphicsLayer) {
  const layer = new GraphicsLayer();   // слой с маркерами

  const view = new SceneView({
    container: "viewDiv",
    map: new Map({ basemap: "osm", layers: [layer] }),
    viewingMode: "global",
    camera: { position: { longitude: 15, latitude: 52, z: MAX_Z }, tilt: 0 },
    /* Зум работает только между MIN_Z и MAX_Z */
    constraints: { altitude: { min: MIN_Z, max: MAX_Z } }
  });

  /* Создаём маркеры после того, как готовы все картинки.
     Если файл не найден, этот маркер пропускается, остальные работают */
  Promise.all(PLACES.map(p => makeSquare(p.img, p.label).catch(e => { console.error(e); return null; })))
    .then(res => {
      PLACES.forEach((p, i) => {
        if (!res[i]) return;
        layer.add(new Graphic({
          geometry: { type: "point", longitude: p.lon, latitude: p.lat },
          attributes: { name: p.name, url: p.url, pic: res[i].photo, dx: p.dx },
          symbol: {
            type: "picture-marker", url: res[i].marker,
            width: (SIZE + 2 * SIDE) + "px", height: (SIZE + 2 * VPAD) + "px",
            xoffset: p.dx * 0.75
          }
        }));
      });
    });

  /* ===== ПЛАШКА ПРИ НАВЕДЕНИИ ===== */
  const tip = document.getElementById("tip");
  const tipImg = tip.querySelector("img");
  const tipText = tip.querySelector(".txt");
  const tipCountry = tip.querySelector(".country");

  /* Какой маркер под курсором (или null) */
  async function hit(e) {
    const res = await view.hitTest(e, { include: layer });
    return res.results.length ? res.results[0].graphic : null;
  }

  view.on("pointer-move", async (e) => {
    const g = await hit(e);
    view.container.style.cursor = g ? "pointer" : "default";
    if (!g) { tip.classList.remove("show"); return; }

    const pt = view.toScreen(g.geometry);
    const x = pt.x + g.attributes.dx;
    tipImg.src = g.attributes.pic;

    /* Делим «Название (Страна)» на две строки */
    const m = g.attributes.name.match(/^(.*)\s\((.*)\)$/);
    tipText.textContent = m ? m[1] : g.attributes.name;
    tipCountry.textContent = m ? m[2] : "";

    /* Не хватает места справа: плашка раскрывается влево */
    tip.classList.toggle("left", x + PLAQUE_W > window.innerWidth - 8);
    tip.style.left = x + "px";
    tip.style.top = pt.y + "px";
    tip.classList.add("show");
  });

  view.on("pointer-leave", () => { tip.classList.remove("show"); });

  /* Клик: переход на страницу проекта */
  view.on("click", async (e) => {
    const g = await hit(e);
    if (g) window.location.href = g.attributes.url;
  });
});
</script>
</body>
</html>
