<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globe</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/dark/main.css">
<script src="https://js.arcgis.com/4.31/"></script>
<style>
  html, body, #viewDiv { margin:0; height:100%; width:100%; background:#0b1f2e; }
  #log { position:fixed; top:0; left:0; z-index:99; margin:0; padding:8px;
         color:#fff; background:rgba(150,0,0,.85); font:13px monospace; white-space:pre-wrap; max-width:95%; }
</style>
</head>
<body>
<div id="viewDiv"></div>
<pre id="log">1: html loaded</pre>

<script>
const log = (t) => { document.getElementById("log").textContent += "\n" + t; };
window.addEventListener("error", (e) => log("JS ERROR: " + e.message));
window.addEventListener("unhandledrejection", (e) => log("PROMISE ERROR: " + (e.reason && e.reason.message || e.reason)));
log("2: typeof require = " + typeof require);

require(["esri/Map", "esri/views/SceneView"], function (Map, SceneView) {
  log("3: modules loaded");
  const view = new SceneView({
    container: "viewDiv",
    map: new Map({ basemap: "osm" }),
    viewingMode: "global",
    camera: { position: { longitude: 14, latitude: 50, z: 5500000 } }
  });
  log("4: view created");
  view.when(
    () => log("5: view ready"),
    (e) => log("VIEW ERROR: " + (e && e.message ? e.message : e))
  );
}, function (err) {
  log("REQUIRE ERROR: " + err);
});
</script>
</body>
</html>
